<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Chatbot Manager" }}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><img src="/static/CIFS_logo.png" alt="CIFS" class="brand-logo">Chatbot Manager</div>
      <nav aria-label="Primary navigation">
        <a href="/" class="{{ 'active' if active_page == 'dashboard' else '' }}" {% if active_page == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="/channels" class="{{ 'active' if active_page == 'channels' else '' }}" {% if active_page == 'channels' %}aria-current="page"{% endif %}>Channels</a>
        <a href="/rules" class="{{ 'active' if active_page == 'rules' else '' }}" {% if active_page == 'rules' %}aria-current="page"{% endif %}>Rules</a>
        <a href="/knowledge" class="{{ 'active' if active_page == 'knowledge' else '' }}" {% if active_page == 'knowledge' %}aria-current="page"{% endif %}>Knowledge</a>
        <a href="/knowledge-graph" class="{{ 'active' if active_page == 'knowledge_graph' else '' }}" {% if active_page == 'knowledge_graph' %}aria-current="page"{% endif %}>Graph</a>
        <a href="/assistant" class="{{ 'active' if active_page == 'assistant' else '' }}" {% if active_page == 'assistant' %}aria-current="page"{% endif %}>Assistant</a>
        <a href="/test-chat" class="{{ 'active' if active_page == 'test_chat' else '' }}" {% if active_page == 'test_chat' %}aria-current="page"{% endif %}>Test Chat</a>
        <a href="/logs" class="{{ 'active' if active_page == 'logs' else '' }}" {% if active_page == 'logs' %}aria-current="page"{% endif %}>Logs</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <span>{{ admin_email or "" }}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token_for(admin_email) }}">
          <button type="submit">Log out</button>
        </form>
      </header>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
